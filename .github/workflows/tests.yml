name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code -- web/app.js
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:ui
        env:
          REDREVIEW_UI_ORIGIN: http://100.64.0.10:8844
      - name: Live provider smoke check (temporary data)
        if: matrix.python == '3.11'
        continue-on-error: true
        run: python3 scripts/check-live-providers.py
